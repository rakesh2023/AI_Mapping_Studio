<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 110" role="img" aria-label="PwC">
  <!-- PwC device: two flat bars side by side, the right one stepped up (a flag) -->
  <g>
    <polygon points="150,50 166,34 206,34 190,50" fill="#EB5C1C"/>
    <polygon points="196,30 212,14 252,14 236,30" fill="#EB5C1C"/>
  </g>
  <!-- Wordmark (dark ink, for LIGHT backgrounds). Baseline raised so the 'p' descender is not clipped. -->
  <text x="4" y="84" font-family="Georgia,'Times New Roman',serif" font-size="82" font-weight="700" fill="#1a1a1a" letter-spacing="-4">pwc</text>
</svg>
