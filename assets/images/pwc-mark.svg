<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-label="PwC">
  <!-- PwC device (two flat bars side by side, right stepped up) above the wordmark; white ink -->
  <g>
    <polygon points="24,42 37,28 67,28 54,42"  fill="#EB5C1C"/>
    <polygon points="60,26 73,12 103,12 90,26" fill="#EB5C1C"/>
  </g>
  <!-- baseline raised so the 'p' descender is not clipped -->
  <text x="8" y="82" font-family="Georgia,'Times New Roman',serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-3">pwc</text>
</svg>
