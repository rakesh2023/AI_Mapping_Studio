<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Usage Report - AI Mapping Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/common.css?v=20260819b">
<link rel="stylesheet" href="../css/sidebar.css?v=20260819b">
<link rel="stylesheet" href="../css/tables.css?v=20260819b">
<link rel="stylesheet" href="../css/forms.css?v=20260819b">
<link rel="stylesheet" href="../css/responsive.css?v=20260819b">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-container"></aside>
  <div class="main-wrapper">
    <header id="header-container"></header>
    <main class="content-area">
      <div class="breadcrumb-bar">
        <div><div class="crumb">AI Mapping Studio <i class="bi bi-chevron-right"></i> Reports <i class="bi bi-chevron-right"></i> AI Usage Report</div>
        <h2>AI Usage Report</h2></div>
        <div class="d-flex gap-2 flex-wrap">
          <button type="button" class="btn btn-outline-soft" id="refreshBtn"><i class="bi bi-arrow-clockwise me-1"></i> Refresh</button>
          <button type="button" class="btn btn-outline-soft" id="clearHistoryBtn"><i class="bi bi-trash me-1"></i> Clear History</button>
        </div>
      </div>

      <!-- Filters -->
      <div class="card-el mb-3">
        <div class="row g-3 align-items-end">
          <div class="col-md-3">
            <div class="form-group mb-0">
              <label>Start date</label>
              <input type="date" class="form-control" id="startDate">
            </div>
          </div>
          <div class="col-md-3">
            <div class="form-group mb-0">
              <label>End date</label>
              <input type="date" class="form-control" id="endDate">
            </div>
          </div>
          <div class="col-md-3">
            <div class="form-group mb-0">
              <label>Feature</label>
              <select class="form-select" id="featureFilter"><option value="">All features</option></select>
            </div>
          </div>
          <div class="col-md-3 d-flex gap-2">
            <button type="button" class="btn btn-primary" id="applyBtn"><i class="bi bi-funnel me-1"></i> Apply</button>
            <button type="button" class="btn btn-outline-soft" id="resetBtn">Reset (last 7 days)</button>
          </div>
        </div>
      </div>

      <!-- Summary cards -->
      <div class="row g-3 mb-3">
        <div class="col-md-3"><div class="card-el text-center">
          <div class="text-xs text-muted-2">Total Calls</div>
          <div class="fs-3 fw-bold" id="suTotalCalls">0</div>
          <div class="text-xs text-muted-2" id="suFailed"></div>
        </div></div>
        <div class="col-md-3"><div class="card-el text-center">
          <div class="text-xs text-muted-2">Total Input Tokens</div>
          <div class="fs-3 fw-bold" id="suInput">0</div>
        </div></div>
        <div class="col-md-3"><div class="card-el text-center">
          <div class="text-xs text-muted-2">Total Output Tokens</div>
          <div class="fs-3 fw-bold" id="suOutput">0</div>
        </div></div>
        <div class="col-md-3"><div class="card-el text-center">
          <div class="text-xs text-muted-2">Total Tokens</div>
          <div class="fs-3 fw-bold text-success" id="suTotal">0</div>
        </div></div>
      </div>

      <!-- Log table -->
      <div class="card-el">
        <div class="section-title d-flex align-items-center justify-content-between flex-wrap gap-2">
          <span><i class="bi bi-list-ul"></i> Call Log</span>
          <span class="text-xs text-muted-2" id="logInfo"></span>
        </div>
        <div class="table-responsive-el">
          <table class="grid-table" id="usageTable">
            <thead><tr>
              <th>Date / Time</th><th>Feature</th><th>Model</th>
              <th class="text-end">Input</th><th class="text-end">Output</th><th class="text-end">Total</th>
              <th>Status</th>
            </tr></thead>
            <tbody id="usageBody"></tbody>
          </table>
        </div>
        <div class="d-flex align-items-center justify-content-between mt-2">
          <span class="text-xs text-muted-2" id="pageInfo"></span>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-soft" id="prevBtn" disabled><i class="bi bi-chevron-left"></i> Prev</button>
            <button type="button" class="btn btn-sm btn-outline-soft" id="nextBtn" disabled>Next <i class="bi bi-chevron-right"></i></button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js?v=20260819b"></script>
<script src="../js/navigation.js?v=20260819b"></script>
<script src="../js/ai-usage-report.js?v=20260819b"></script>
</body>
</html>
