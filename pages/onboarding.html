<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set up your client - AI Mapping Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/common.css?v=20260815j">
<link rel="stylesheet" href="../css/forms.css?v=20260815j">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-app);padding:24px;}
  .ob-card{width:100%;max-width:560px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.12);padding:26px 28px;}
  .ob-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .ob-brand .bi{color:var(--primary);font-size:1.5rem;}
  .ob-brand h1{font-size:1.15rem;margin:0;color:var(--text-main);}
  .ob-sub{color:var(--text-muted);font-size:.82rem;margin-bottom:18px;}
  .ob-card label{font-size:.8rem;font-weight:600;color:var(--text-main);margin-bottom:3px;display:block;}
  .ob-card .form-control,.ob-card .form-select{margin-bottom:12px;}
  .ob-err{background:var(--danger-bg);color:var(--danger);border:1px solid #f3c9c6;border-radius:8px;
    padding:8px 11px;font-size:.8rem;margin-bottom:12px;display:none;}
  .ob-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .ob-actions{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
</style>
</head>
<body>
  <div class="ob-card">
    <div class="ob-brand"><i class="bi bi-building-add"></i><h1>Set up your client</h1></div>
    <div class="ob-sub">Tell us about the client this workspace is for. You can add more clients later.</div>

    <div class="ob-err" id="obErr"></div>

    <form id="obForm" novalidate>
      <label for="cName">Client name <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="cName" placeholder="e.g. Acme Insurance" required>

      <div class="ob-row">
        <div>
          <label for="cIndustry">Industry</label>
          <input type="text" class="form-control" id="cIndustry" placeholder="e.g. Insurance">
        </div>
        <div>
          <label for="cMigration">Migration type</label>
          <select class="form-select" id="cMigration">
            <option value="">—</option>
            <option>Claims</option><option>Policy</option><option>Billing</option>
            <option>Contacts</option><option>Other</option>
          </select>
        </div>
      </div>

      <div class="ob-row">
        <div>
          <label for="cSourceApp">Source application</label>
          <input type="text" class="form-control" id="cSourceApp" placeholder="e.g. Legacy Mainframe">
        </div>
        <div>
          <label for="cTargetApp">Target application</label>
          <input type="text" class="form-control" id="cTargetApp" placeholder="e.g. Guidewire ClaimCenter">
        </div>
      </div>

      <label for="cNotes">Notes <span class="text-muted-2 text-xs">(optional)</span></label>
      <textarea class="form-control" id="cNotes" rows="2" placeholder="Any context for the mapping work…"></textarea>

      <div class="ob-actions">
        <button type="button" class="btn btn-outline-soft btn-sm" id="obLogout"><i class="bi bi-box-arrow-right me-1"></i> Log out</button>
        <button type="submit" class="btn btn-primary" id="obSubmit"><i class="bi bi-check2 me-1"></i> Create & continue</button>
      </div>
    </form>
  </div>

<script src="../js/onboarding.js?v=20260815j"></script>
</body>
</html>
