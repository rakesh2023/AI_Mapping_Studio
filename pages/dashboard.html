<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - AI Mapping Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/common.css?v=20260813b">
<link rel="stylesheet" href="../css/sidebar.css?v=20260813b">
<link rel="stylesheet" href="../css/tables.css?v=20260813b">
<link rel="stylesheet" href="../css/responsive.css?v=20260813b">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-container"></aside>
  <div class="main-wrapper">
    <header id="header-container"></header>
    <main class="content-area">

      <div class="breadcrumb-bar">
        <div>
          <div class="crumb">AI Mapping Studio <i class="bi bi-chevron-right"></i> Dashboard</div>
          <h2>Migration Project Dashboard</h2>
        </div>
        <div class="d-flex gap-2">
          <a href="ai-mapping-generator.html" class="btn btn-primary"><i class="bi bi-stars me-1"></i> Generate Mapping</a>
          <a href="export.html" class="btn btn-outline-soft"><i class="bi bi-download me-1"></i> Export</a>
        </div>
      </div>

      <div class="card-el mb-4">
        <div class="section-title"><i class="bi bi-signpost-split"></i> Migration Workflow</div>
        <div id="workflowStepper"></div>
      </div>

      <div id="kpiGrid" class="kpi-grid"></div>

      <div class="row g-4">
        <div class="col-lg-7">
          <div class="card-el mb-4">
            <div class="section-title"><i class="bi bi-graph-up-arrow"></i> Mapping Progress</div>
            <div id="progressBars"></div>
          </div>
          <div class="card-el">
            <div class="section-title"><i class="bi bi-clock-history"></i> Recent Activity</div>
            <div id="recentActivity" class="text-xs"></div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card-el mb-4">
            <div class="section-title"><i class="bi bi-pie-chart"></i> Mappings by Type</div>
            <div id="byType"></div>
          </div>
          <div class="card-el mb-4">
            <div class="section-title"><i class="bi bi-bar-chart"></i> Mappings by Status</div>
            <div id="byStatus"></div>
          </div>
          <div class="card-el">
            <div class="section-title"><i class="bi bi-exclamation-diamond"></i> Low Confidence Mappings</div>
            <div id="lowConfList"></div>
          </div>
        </div>
      </div>

      <div class="card-el mt-4">
        <div class="section-title"><i class="bi bi-shield-check"></i> Validation Summary</div>
        <div id="validationSummary" class="row g-3"></div>
      </div>

    </main>
  </div>
</div>
<div id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js?v=20260813b"></script>
<script src="../js/navigation.js?v=20260813b"></script>
<script src="../js/target-schema.js?v=20260813b"></script>
<script src="../js/dashboard.js?v=20260813b"></script>
</body>
</html>
