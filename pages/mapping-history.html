<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapping History - AI Mapping Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/common.css?v=20260816c">
<link rel="stylesheet" href="../css/sidebar.css?v=20260816c">
<link rel="stylesheet" href="../css/tables.css?v=20260816c">
<link rel="stylesheet" href="../css/forms.css?v=20260816c">
<link rel="stylesheet" href="../css/mapping.css?v=20260816c">
<link rel="stylesheet" href="../css/responsive.css?v=20260816c">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-container"></aside>
  <div class="main-wrapper">
    <header id="header-container"></header>
    <main class="content-area">
      <div class="breadcrumb-bar">
        <div><div class="crumb">AI Mapping Studio <i class="bi bi-chevron-right"></i> Mapping History</div>
        <h2>Mapping History &amp; Audit Trail</h2></div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-soft" id="exportHistoryBtn"><i class="bi bi-download me-1"></i> Export CSV</button>
          <button class="btn btn-outline-soft" id="clearHistoryBtn"><i class="bi bi-trash me-1"></i> Clear History</button>
        </div>
      </div>

      <div class="card-el">
        <div class="table-toolbar">
          <div class="filters" id="hFilterBar"></div>
        </div>
        <div class="table-responsive-el">
          <table class="grid-table" id="historyTable">
            <thead><tr>
              <th>Timestamp</th><th>Mapping ID</th><th>Source Field</th><th>Target Field</th>
              <th>Change Type</th><th>Previous Value</th><th>New Value</th><th>Reason</th><th>User</th><th>Origin</th>
            </tr></thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
        <div class="pagination-bar">
          <div id="pgInfo"></div>
          <div class="d-flex align-items-center gap-3">
            <div>Rows per page:
              <select id="hPageSize" style="border:1px solid var(--border);border-radius:6px;padding:2px 6px;">
                <option>25</option><option selected>50</option><option>100</option>
              </select>
            </div>
            <div class="pg-controls" id="pgControls"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js?v=20260816c"></script>
<script src="../js/navigation.js?v=20260816c"></script>
<script src="../js/mapping-history.js?v=20260816c"></script>
</body>
</html>
