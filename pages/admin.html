<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Admin - AI Mapping Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/common.css?v=20260816j">
<link rel="stylesheet" href="../css/sidebar.css?v=20260816j">
<link rel="stylesheet" href="../css/forms.css?v=20260816j">
<link rel="stylesheet" href="../css/tables.css?v=20260816j">
<link rel="stylesheet" href="../css/responsive.css?v=20260816j">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-container"></aside>
  <div class="main-wrapper">
    <header id="header-container"></header>
    <main class="content-area">

      <div class="breadcrumb-bar">
        <div>
          <div class="crumb">AI Mapping Studio <i class="bi bi-chevron-right"></i> Administration <i class="bi bi-chevron-right"></i> Users</div>
          <h2>User Administration</h2>
        </div>
      </div>

      <div class="card-el mb-4">
        <div class="section-title"><i class="bi bi-person-plus"></i> Create user</div>
        <p class="text-xs text-muted-2 mb-3">New accounts are standard users. Self-registration is disabled — users can only be created here.</p>
        <div class="auth-err" id="createErr" style="display:none;"></div>
        <form id="createForm" class="row g-2 align-items-end" novalidate>
          <div class="col-md-4">
            <label class="form-label text-xs" for="nEmail">Email</label>
            <input type="email" class="form-control" id="nEmail" autocomplete="off" placeholder="you@company.com" required>
          </div>
          <div class="col-md-3">
            <label class="form-label text-xs" for="nName">Full name</label>
            <input type="text" class="form-control" id="nName" autocomplete="off" placeholder="e.g. Alex Morgan">
          </div>
          <div class="col-md-3">
            <label class="form-label text-xs" for="nPass">Password</label>
            <input type="password" class="form-control" id="nPass" autocomplete="new-password" placeholder="At least 8 characters" required>
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100" id="createBtn"><i class="bi bi-plus-lg me-1"></i> Create</button>
          </div>
        </form>
      </div>

      <div class="card-el">
        <div class="section-title"><i class="bi bi-people"></i> Users <span class="text-muted-2 text-xs" id="userCount"></span></div>
        <div class="table-responsive">
          <table class="table table-sm align-middle" id="usersTable">
            <thead>
              <tr>
                <th>Email</th><th>Name</th><th>Role</th><th>Clients</th>
                <th>Created</th><th>Last login</th><th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="usersBody"><tr><td colspan="7" class="text-muted-2 text-xs">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>
<div id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js?v=20260816j"></script>
<script src="../js/navigation.js?v=20260816j"></script>
<script src="../js/admin.js?v=20260816j"></script>
</body>
</html>
