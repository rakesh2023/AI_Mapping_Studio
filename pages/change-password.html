<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change your password - AI Mapping Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/common.css?v=20260820o">
<link rel="stylesheet" href="../css/forms.css?v=20260820o">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-app);padding:24px;}
  .cp-card{width:100%;max-width:480px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.12);padding:26px 28px;}
  .cp-toplogo{height:28px;width:auto;display:block;margin-bottom:16px;}
  .cp-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .cp-brand .bi{color:var(--primary);font-size:1.5rem;}
  .cp-brand h1{font-size:1.15rem;margin:0;color:var(--text-main);}
  .cp-sub{color:var(--text-muted);font-size:.82rem;margin-bottom:18px;}
  .cp-card label{font-size:.8rem;font-weight:600;color:var(--text-main);margin-bottom:3px;display:block;}
  .cp-card .form-control{margin-bottom:12px;}
  .cp-err{background:var(--danger-bg);color:var(--danger);border:1px solid #f3c9c6;border-radius:8px;
    padding:8px 11px;font-size:.8rem;margin-bottom:12px;display:none;}
  .cp-note{background:var(--warning-bg);color:var(--warning);border:1px solid #f3ddb0;border-radius:8px;
    padding:8px 11px;font-size:.78rem;margin-bottom:14px;display:none;}
  .cp-hint{font-size:.72rem;color:var(--text-muted);margin:-6px 0 12px;}
  .cp-actions{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
</style>
</head>
<body>
  <div class="cp-card">
    <img class="cp-toplogo" src="../assets/images/pwc-logo-dark.svg" alt="PwC">
    <div class="cp-brand"><i class="bi bi-shield-lock"></i><h1>Change your password</h1></div>
    <div class="cp-sub" id="cpSub">Set a new password for your account.</div>

    <div class="cp-note" id="cpForcedNote"><i class="bi bi-info-circle me-1"></i> For security, please change the initial password before continuing.</div>
    <div class="cp-err" id="cpErr"></div>

    <form id="cpForm" novalidate autocomplete="off">
      <label for="cpCurrent">Current password</label>
      <input type="password" class="form-control" id="cpCurrent" autocomplete="current-password" required>

      <label for="cpNew">New password</label>
      <input type="password" class="form-control" id="cpNew" autocomplete="new-password" required>
      <div class="cp-hint">At least 8 characters, and different from your current password.</div>

      <label for="cpConfirm">Confirm new password</label>
      <input type="password" class="form-control" id="cpConfirm" autocomplete="new-password" required>

      <div class="cp-actions">
        <button type="button" class="btn btn-outline-soft btn-sm" id="cpLogout"><i class="bi bi-box-arrow-right me-1"></i> Log out</button>
        <button type="submit" class="btn btn-primary" id="cpSubmit"><i class="bi bi-check2 me-1"></i> Update password</button>
      </div>
    </form>
  </div>

<script src="../js/change-password.js?v=20260820o"></script>
</body>
</html>
