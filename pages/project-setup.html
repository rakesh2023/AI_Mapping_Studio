<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Setup - AI Mapping Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/common.css?v=20260814l">
<link rel="stylesheet" href="../css/sidebar.css?v=20260814l">
<link rel="stylesheet" href="../css/forms.css?v=20260814l">
<link rel="stylesheet" href="../css/responsive.css?v=20260814l">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-container"></aside>
  <div class="main-wrapper">
    <header id="header-container"></header>
    <main class="content-area">
      <div class="breadcrumb-bar">
        <div><div class="crumb">AI Mapping Studio <i class="bi bi-chevron-right"></i> Project Setup</div>
        <h2>Migration Project Setup</h2></div>
      </div>

      <div class="card-el" style="max-width:1000px;">
        <form id="projectForm">
          <div class="form-section">
            <div class="form-section-title">Project Details</div>
            <div class="form-grid">
              <div class="form-group"><label>Project Name <span class="req">*</span></label><input class="form-control" id="pName" required></div>
              <div class="form-group"><label>Client / Program Name</label><input class="form-control" id="pClient"></div>
              <div class="form-group" style="grid-column:1/-1;"><label>Project Description</label><textarea class="form-control" id="pDesc" rows="2"></textarea></div>
            </div>
          </div>

          <div class="form-section">
            <div class="form-section-title">Migration Scope</div>
            <div class="form-grid cols-3">
              <div class="form-group"><label>Migration Type</label>
                <input class="form-control" id="pType" value="Data Conversion" readonly></div>
              <div class="form-group"><label>Domain</label>
                <input class="form-control" id="pDomain" value="Insurance" readonly></div>
              <div class="form-group"><label>Source Application</label><input class="form-control" id="pSource" value="Legacy Policy Administration System"></div>
              <div class="form-group"><label>Target Application</label><input class="form-control" id="pTarget" value="Guidewire PolicyCenter"></div>
              <div class="form-group"><label>Project Owner</label><input class="form-control" id="pOwner"></div>
              <div class="form-group"><label>Start Date</label><input type="date" class="form-control" id="pStart"></div>
              <div class="form-group"><label>Target Date</label><input type="date" class="form-control" id="pEnd"></div>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-outline-soft" id="resetBtn">Reset</button>
            <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Save Project</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
<div id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js?v=20260814l"></script>
<script src="../js/navigation.js?v=20260814l"></script>
<script src="../js/project-setup.js?v=20260814l"></script>
</body>
</html>
