<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validation - AI Mapping Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/common.css?v=20260819b">
<link rel="stylesheet" href="../css/sidebar.css?v=20260819b">
<link rel="stylesheet" href="../css/tables.css?v=20260819b">
<link rel="stylesheet" href="../css/forms.css?v=20260819b">
<link rel="stylesheet" href="../css/mapping.css?v=20260819b">
<link rel="stylesheet" href="../css/responsive.css?v=20260819b">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-container"></aside>
  <div class="main-wrapper">
    <header id="header-container"></header>
    <main class="content-area">
      <div class="breadcrumb-bar">
        <div><div class="crumb">AI Mapping Studio <i class="bi bi-chevron-right"></i> Validation</div>
        <h2>Mapping Validation</h2></div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-soft" id="clearValidationBtn"><i class="bi bi-trash me-1"></i> Clear Validation</button>
          <button class="btn btn-primary" id="runValidationBtn"><i class="bi bi-play-fill me-1"></i> Run Validation</button>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-3"><div class="card-el text-center">
          <div class="text-xs text-muted-2">Passed</div>
          <div class="fs-3 fw-bold text-success" id="statPassed">0</div>
        </div></div>
        <div class="col-md-3"><div class="card-el text-center">
          <div class="text-xs text-muted-2">Warnings</div>
          <div class="fs-3 fw-bold text-warning" id="statWarning">0</div>
        </div></div>
        <div class="col-md-3"><div class="card-el text-center">
          <div class="text-xs text-muted-2">Failed</div>
          <div class="fs-3 fw-bold text-danger" id="statFailed">0</div>
        </div></div>
        <div class="col-md-3"><div class="card-el text-center">
          <div class="text-xs text-muted-2">Total Mappings Checked</div>
          <div class="fs-3 fw-bold" id="statTotal">0</div>
        </div></div>
      </div>

      <div class="card-el mb-3">
        <div class="section-title"><i class="bi bi-list-check"></i> Validation Rules</div>
        <div class="table-responsive-el">
          <table class="grid-table" id="rulesTable">
            <thead><tr><th>Rule ID</th><th>Rule Name</th><th>Description</th><th>Severity</th><th>Affected Mappings</th></tr></thead>
            <tbody id="rulesBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card-el">
        <div class="table-toolbar">
          <div class="filters" id="filterBar"></div>
        </div>
        <div class="section-title"><i class="bi bi-exclamation-triangle"></i> Validation Issues</div>
        <div class="table-responsive-el">
          <table class="grid-table" id="issuesTable">
            <thead><tr><th>Mapping ID</th><th>Source &gt; Target</th><th>Rule</th><th>Severity</th><th>Message</th><th>Action</th></tr></thead>
            <tbody id="issuesBody"></tbody>
          </table>
        </div>
        <div class="pagination-bar">
          <div id="pgInfo"></div>
          <div class="pg-controls" id="pgControls"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<div id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js?v=20260819b"></script>
<script src="../js/navigation.js?v=20260819b"></script>
<script src="../js/validation.js?v=20260819b"></script>
</body>
</html>
