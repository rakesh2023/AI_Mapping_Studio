<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validation Report - AI Data Conversion Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/common.css?v=20260831t">
<link rel="stylesheet" href="../css/sidebar.css?v=20260831t">
<link rel="stylesheet" href="../css/tables.css?v=20260831t">
<link rel="stylesheet" href="../css/forms.css?v=20260831t">
<link rel="stylesheet" href="../css/mapping.css?v=20260831t">
<link rel="stylesheet" href="../css/responsive.css?v=20260831t">
<style>
  .vr-chart-wrap{position:relative;height:300px;}
  .vr-empty{padding:2rem;text-align:center;color:var(--text-muted);}
  .vr-drill{color:var(--primary);cursor:pointer;text-decoration:none;white-space:nowrap;font-size:.82rem;}
  .vr-drill:hover{text-decoration:underline;}
  tr.vr-row{cursor:pointer;}
  tr.vr-row:hover{background:var(--hover-bg, rgba(0,0,0,.03));}
  @media (max-width:900px){ .vr-chart-wrap{height:260px;} }
</style>
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-container"></aside>
  <div class="main-wrapper">
    <header id="header-container"></header>
    <main class="content-area">
      <div class="breadcrumb-bar">
        <div><div class="crumb">AI Data Conversion Studio <i class="bi bi-chevron-right"></i> Validation Report</div>
        <h2>Validation Report</h2></div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" id="refreshBtn"><i class="bi bi-arrow-clockwise me-1"></i> Run &amp; Refresh</button>
        </div>
      </div>

      <div id="reportBanner" class="mb-3"></div>

      <!-- KPI summary -->
      <div class="row g-3 mb-3">
        <div class="col-6 col-md"><div class="card-el text-center">
          <div class="text-xs text-muted-2">Tables Selected</div>
          <div class="fs-3 fw-bold" id="kpiTables">0</div>
        </div></div>
        <div class="col-6 col-md"><div class="card-el text-center">
          <div class="text-xs text-muted-2">Total Issues</div>
          <div class="fs-3 fw-bold" id="kpiTotal">0</div>
        </div></div>
        <div class="col-6 col-md"><div class="card-el text-center">
          <div class="text-xs text-muted-2">Duplicate Rows</div>
          <div class="fs-3 fw-bold text-danger" id="kpiDuplicates">0</div>
        </div></div>
        <div class="col-6 col-md"><div class="card-el text-center">
          <div class="text-xs text-muted-2">Mandatory Nulls</div>
          <div class="fs-3 fw-bold text-danger" id="kpiMandatory">0</div>
        </div></div>
        <div class="col-6 col-md"><div class="card-el text-center">
          <div class="text-xs text-muted-2">Invalid Typelist</div>
          <div class="fs-3 fw-bold text-warning" id="kpiTypelist">0</div>
        </div></div>
        <div class="col-6 col-md"><div class="card-el text-center">
          <div class="text-xs text-muted-2">FK Orphans</div>
          <div class="fs-3 fw-bold text-warning" id="kpiForeignKey">0</div>
        </div></div>
      </div>

      <!-- Charts -->
      <div class="row g-3 mb-3">
        <div class="col-lg-5"><div class="card-el">
          <div class="section-title"><i class="bi bi-pie-chart"></i> Issues by Type</div>
          <div class="vr-chart-wrap"><canvas id="chartType"></canvas></div>
        </div></div>
        <div class="col-lg-7"><div class="card-el">
          <div class="section-title"><i class="bi bi-bar-chart"></i> Issues by Table <span class="text-xs text-muted-2 fw-normal ms-2">(worst first, top 15)</span></div>
          <div class="vr-chart-wrap"><canvas id="chartTable"></canvas></div>
        </div></div>
      </div>

      <!-- Detailed issues -->
      <div class="card-el">
        <div class="table-toolbar">
          <div class="filters" id="filterBar"></div>
        </div>
        <div class="section-title"><i class="bi bi-list-ul"></i> Issue Details</div>
        <div class="table-responsive-el">
          <table class="grid-table" id="issuesTable">
            <thead><tr><th style="width:70px;"></th><th>Table</th><th>Validation</th><th>Column(s)</th><th>Detail</th><th>Rows</th><th>Samples</th></tr></thead>
            <tbody id="issuesBody"></tbody>
          </table>
        </div>
        <div class="pagination-bar">
          <div id="pgInfo"></div>
          <div class="pg-controls" id="pgControls"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<div id="toast-stack"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../js/common.js?v=20260831t"></script>
<script src="../js/navigation.js?v=20260831t"></script>
<script src="../js/target-schema.js?v=20260831t"></script>
<script src="../js/validation-report.js?v=20260831t"></script>
</body>
</html>
