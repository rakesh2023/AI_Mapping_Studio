<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - AI Mapping Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/common.css?v=20260815j">
<link rel="stylesheet" href="../css/forms.css?v=20260815j">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-app);padding:24px;}
  .auth-card{width:100%;max-width:420px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.12);padding:26px 28px;}
  .auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .auth-brand .bi{color:var(--primary);font-size:1.5rem;}
  .auth-brand h1{font-size:1.15rem;margin:0;color:var(--text-main);}
  .auth-sub{color:var(--text-muted);font-size:.82rem;margin-bottom:18px;}
  .auth-tabs{display:flex;gap:6px;margin-bottom:16px;}
  .auth-tab{flex:1;padding:8px 10px;border:1px solid var(--border);background:var(--bg-app);border-radius:8px;
    font-size:.85rem;font-weight:600;color:var(--text-muted);cursor:pointer;}
  .auth-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .auth-card label{font-size:.8rem;font-weight:600;color:var(--text-main);margin-bottom:3px;display:block;}
  .auth-card .form-control{margin-bottom:12px;}
  .auth-err{background:var(--danger-bg);color:var(--danger);border:1px solid #f3c9c6;border-radius:8px;
    padding:8px 11px;font-size:.8rem;margin-bottom:12px;display:none;}
  .auth-submit{width:100%;}
  .auth-foot{margin-top:14px;font-size:.78rem;color:var(--text-muted);text-align:center;}
</style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand"><i class="bi bi-diagram-3-fill"></i><h1>AI Mapping Studio</h1></div>
    <div class="auth-sub">Sign in to your workspace</div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tabLogin" data-mode="login">Log in</button>
      <button type="button" class="auth-tab" id="tabSignup" data-mode="signup">Sign up</button>
    </div>

    <div class="auth-err" id="authErr"></div>

    <form id="authForm" novalidate>
      <div id="nameGroup" style="display:none;">
        <label for="fName">Full name</label>
        <input type="text" class="form-control" id="fName" autocomplete="name" placeholder="e.g. Alex Morgan">
      </div>
      <label for="fEmail">Email</label>
      <input type="email" class="form-control" id="fEmail" autocomplete="username" placeholder="you@company.com" required>
      <label for="fPass">Password</label>
      <input type="password" class="form-control" id="fPass" autocomplete="current-password" placeholder="••••••••" required>
      <div class="text-xs text-muted-2 mb-2" id="pwHint" style="display:none;">At least 8 characters.</div>
      <button type="submit" class="btn btn-primary auth-submit" id="authSubmit">Log in</button>
    </form>
    <div class="auth-foot" id="authFoot">New here? <a href="#" id="switchToSignup">Create an account</a></div>
  </div>

<script src="../js/auth.js?v=20260815j"></script>
</body>
</html>
